info:
  name: Volume upload
  type: http
  seq: 11

http:
  method: POST
  url: http://{{base_url_prod}}/api/v1/sv-upload
  body:
    type: multipart-form
    data:
      - name: volume_type
        type: text
        value: Fetal Anatomy
      - name: volume_name
        type: text
        value: FL - I0000004
      - name: volume_ga
        type: text
        value: "22"
      - name: volume_fetal_presentation
        type: text
        value: Cephalic
      - name: trimester
        type: text
        value: Second Trimester
      - name: description
        type: text
        value: Sample fetal anatomy case details
      - name: file
        type: file
        value:
          - C:\path\to\FL - I0000004.vol
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
