info:
  name: Volume Placement
  type: http
  seq: 19

http:
  method: POST
  url: http://{{base_url_prod}}/api/v1/volume-placement
  body:
    type: multipart-form
    data:
      - name: volume_id
        type: text
        value: 6982d3f3-8617-49a7-9b0d-d160db9adf6c
      - name: placed_file
        type: file
        value:
          - C:\path\to\placement.json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
