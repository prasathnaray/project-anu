AWSTemplateFormatVersion: '2010-09-09'
Description: Single-request recording uploads with CloudFront routing for the existing API hostname
Parameters:
  ImageUri:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
  CertificateArn:
    Type: String
  RuntimeSecretArn:
    Type: String
  OriginVerify:
    Type: String
    NoEcho: true
    MinLength: 32
  CloudFrontPrefixList:
    Type: String
  ApiHostname:
    Type: String
    Default: api-v1.anuxr.com
  AttachCustomDomain:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  ApiOrigin:
    Type: String
    Default: 84z54to5vl.execute-api.ap-south-1.amazonaws.com
  ContentBucket:
    Type: String
    Default: project-anu-content-299822065337-ap-south-1
Conditions:
  UseCustomDomain: !Equals [!Ref AttachCustomDomain, 'true']
Resources:
  Cluster:
    Type: AWS::ECS::Cluster
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RecordingStorage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RuntimeSecretArn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload]
                Resource: !Sub arn:aws:s3:::${ContentBucket}/projectanu/single-recordings/*
  LoadBalancerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront access to upload ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixList
  TaskGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Upload service accepts traffic from its load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4004
          ToPort: 4004
          SourceSecurityGroupId: !Ref LoadBalancerGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref Subnets
      SecurityGroups: [!Ref LoadBalancerGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '1800'
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 4004
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '120'
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '403', ContentType: text/plain, MessageBody: Forbidden}
  OriginRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Upload-Origin
            Values: [!Ref OriginVerify]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: upload
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 4004}]
          StopTimeout: 120
          Environment:
            - {Name: NODE_ENV, Value: production}
            - {Name: PORT, Value: '4004'}
            - {Name: AWS_REGION, Value: !Ref 'AWS::Region'}
            - {Name: AWS_S3_BUCKET, Value: !Ref ContentBucket}
            - {Name: BUCKET_NAME, Value: projectanu}
            - {Name: STORAGE_PROVIDER, Value: s3}
            - {Name: DATABASE_CA_FILE, Value: certs/supabase-ca.crt}
            - {Name: LAMBDA_SECRET_ID, Value: !Ref RuntimeSecretArn}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: upload
  Service:
    Type: AWS::ECS::Service
    DependsOn: OriginRule
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref Subnets
          SecurityGroups: [!Ref TaskGroup]
      LoadBalancers:
        - ContainerName: upload
          ContainerPort: 4004
          TargetGroupArn: !Ref TargetGroup
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ANU API with single-request recording upload origin
        Aliases: !If [UseCustomDomain, [!Ref ApiHostname], !Ref 'AWS::NoValue']
        HttpVersion: http2
        IPV6Enabled: true
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: api
            DomainName: !Ref ApiOrigin
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
          - Id: upload
            DomainName: !GetAtt LoadBalancer.DNSName
            OriginCustomHeaders:
              - HeaderName: X-Upload-Origin
                HeaderValue: !Ref OriginVerify
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 120
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CacheBehaviors:
          - PathPattern: /api/v1/recordings/new-upload
            TargetOriginId: upload
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /upload-health
            TargetOriginId: upload
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
Outputs:
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  ServiceName:
    Value: !GetAtt Service.Name
  ClusterName:
    Value: !Ref Cluster
  LogGroup:
    Value: !Ref Logs
  TargetGroupArn:
    Value: !Ref TargetGroup
